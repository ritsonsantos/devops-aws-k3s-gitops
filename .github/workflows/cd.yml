
name: CD - Deploy no K3s

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - ".github/workflows/cd.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Nginx no K3s
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      - name: Validar manifestos Kubernetes
        run: kubeconform -strict -summary kubernetes/

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::968138089926:role/github-actions-k3s-deploy
          aws-region: us-east-1

      - name: Enviar manifestos para S3
        env:
          S3_BUCKET: ritson-devops-k3s-artifacts-eb863a5dbfc69544a9cbefb71
        run: |
          tar -czf nginx-manifests.tar.gz -C kubernetes/apps/nginx .
          S3_KEY="deployments/nginx/${GITHUB_SHA}.tar.gz"

          aws s3 cp nginx-manifests.tar.gz \
            "s3://${S3_BUCKET}/${S3_KEY}"

          echo "S3_KEY=${S3_KEY}" >> "$GITHUB_ENV"

      - name: Aplicar manifestos via SSM
        env:
          S3_BUCKET: ritson-devops-k3s-artifacts-eb863a5dbfc69544a9cbefb71
          INSTANCE_ID: i-017dc461291af32e7
        run: |
          jq -n \
            --arg bucket "$S3_BUCKET" \
            --arg key "$S3_KEY" \
            '{
              commands: [
                "set -e",
                ("aws s3 cp s3://" + $bucket + "/" + $key + " /tmp/nginx-manifests.tar.gz"),
                "mkdir -p /tmp/nginx-manifests",
                "tar -xzf /tmp/nginx-manifests.tar.gz -C /tmp/nginx-manifests",
                "/usr/local/bin/k3s kubectl apply -f /tmp/nginx-manifests"
              ]
            }' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM enviado: $COMMAND_ID"

          for i in $(seq 1 30); do
            sleep 10

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Status SSM: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json
              exit 1
            fi
          done

          echo "Tempo limite aguardando o comando SSM."
          exit 1
