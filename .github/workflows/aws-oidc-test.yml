
name: Testar autenticacao AWS OIDC

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::968138089926:role/github-actions-k3s-deploy
          aws-region: us-east-1

      - name: Validar identidade AWS
        run: aws sts get-caller-identity
